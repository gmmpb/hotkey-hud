[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotkey-hud"
version = "0.1.0"
description = "A keyboard-first shortcut and command cheat-sheet HUD for Linux/KDE/Wayland"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "gmmpb"}]
dependencies = [
  "PySide6>=6.7",
  "PyYAML>=6.0",
]

[project.scripts]
hotkey-hud = "hotkey_hud.perf_app:main"

[tool.hatch.build.targets.wheel]
packages = ["hotkey_hud"]

[tool.hatch.build.targets.wheel.force-include]
"hotkey_hud/default.yaml" = "hotkey_hud/default.yaml"
"hotkey_hud/style.qss" = "hotkey_hud/style.qss"
